spring.application.name=SmartRent

spring.datasource.url=jdbc:${SPRING_DATASOURCE_URL:mysql://localhost:3306/smartrent_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Show SQL in the console (helpful for debugging your queries)
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Redis Connection
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

# Tell Spring to use Redis as the cache manager
spring.cache.type=redis

#Security Secrets
jwt.secrets = ${JWT_SECRET:c21hcnRyZW50LXN1cGVyLXNlY3JldC1rZXktZm9yLWp3dC0yMDI0}


#PAYSTACK
paystack.secret.key=${PAY_STACK_SECRET}

#Paystack call back url that redirects to frontend page
app.frontend.url=${FRONTEND_URL:http://localhost:5173}



